<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0E14" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DhanVeda" />
    <meta name="description" content="Personal finance, expense tracker, budgets, investments and split expenses for INR users" />

    <title>DhanVeda — INR Personal Finance & Wealth Tracker</title>
    
    <!-- Google Fonts: Plus Jakarta Sans (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services client script for OAuth 2.0 Token Client -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Prevent theme flash on page load -->
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('dhanveda_dark_mode');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'true' || (saved === null && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full bg-app text-ink-1 font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
